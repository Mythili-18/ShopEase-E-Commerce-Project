
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | ShopEase</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <!-- LEFT SECTION -->
        <div class="auth-left">

            <a href="/" class="auth-logo">
                <span class="logo-icon">S</span>
                ShopEase
            </a>

            <div class="auth-welcome">

                <span>JOIN OUR COMMUNITY</span>

                <h1>Create your shopping account!</h1>

                <p>
                    Discover products, enjoy easy ordering
                    and manage all your shopping in one place.
                </p>

                <div class="auth-illustration">🎁</div>

                <h3>Start your shopping experience today.</h3>

            </div>

        </div>

        <!-- RIGHT SECTION -->
        <div class="auth-right">

            <div class="auth-form register-form">

                <a href="/" class="back-home">
                    ← Back to Home
                </a>

                <h2>Create an account</h2>

                <p class="auth-subtitle">
                    Fill in your details to get started.
                </p>

                <!-- REGISTER FORM -->
                <form id="registerForm">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter 10-digit phone number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                    <button type="submit" class="auth-submit">
                        Create Account →
                    </button>

                    <!-- SUCCESS / ERROR MESSAGE -->
                    <p id="message"></p>

                </form>

                <p class="auth-switch">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>

        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script src="js/register.js"></script>

</body>
</html>

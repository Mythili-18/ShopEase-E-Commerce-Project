
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | ShopEase</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="my-orders-page">

    <header class="my-orders-navbar">

        <a href="dashboard.html" class="my-orders-logo">
            <span class="my-orders-logo-icon">S</span>
            ShopEase
        </a>

        <nav class="my-orders-nav">
            <a href="dashboard.html">Continue Shopping</a>
            <a href="cart.html">My Cart</a>
            <button onclick="logout()" class="my-orders-logout">Logout</button>
        </nav>

    </header>

    <section class="my-orders-hero">

        <div>
            <span class="my-orders-tag">ORDER MANAGEMENT</span>
            <h1>My Orders</h1>
            <p>Track your purchases and stay updated on your deliveries.</p>
        </div>

        <div class="my-orders-hero-icon">📦</div>

    </section>

    <main class="my-orders-main">

        <div class="my-orders-heading">
            <div>
                <span class="my-orders-section-tag">YOUR PURCHASES</span>
                <h2>Order History</h2>
                <p>Here are the details of your orders.</p>
            </div>
        </div>

        <div id="ordersList" class="orders-list">
            Loading orders...
        </div>

    </main>

    <footer class="my-orders-footer">
        <h3>ShopEase</h3>
        <p>Thank you for shopping with us!</p>
        <span>© 2026 ShopEase. All Rights Reserved.</span>
    </footer>

    <script src="js/orders.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ShopEase</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-container">

        <div class="auth-left">
            <a href="/" class="auth-logo">
                <span class="logo-icon">S</span>
                ShopEase
            </a>

            <div class="auth-welcome">
                <span>WELCOME BACK</span>
                <h1>Good to see you again!</h1>
                <p>Login to explore products, manage your cart and track your orders.</p>
                <div class="auth-illustration">🛍️</div>
                <h3>Your shopping journey starts here.</h3>
            </div>
        </div>

        <div class="auth-right">

            <div class="auth-form">
                <a href="/" class="back-home">← Back to Home</a>

                <h2>Login to your account</h2>
                <p class="auth-subtitle">Enter your details to continue shopping.</p>

                <form id="loginForm">

                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="submit" class="auth-submit">
                        Login →
                    </button>

                </form>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="register.html">Create Account</a>
                </p>

            </div>
        </div>

    </div>

    <script src="js/auth.js"></script>
</body>
</html>
